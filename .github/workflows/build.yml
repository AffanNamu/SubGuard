name: Check

# Every push and pull request is checked here: analysis, tests, and that the
# generated database code is current. The store builds are separate:
# android.yml and ios.yml (see docs/RELEASE.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.32.0'

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generated code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/ || (echo "Generated drift code is out of date. Run: dart run build_runner build" && exit 1)

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
