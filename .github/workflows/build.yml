name: Check

# Every push and pull request is checked here: analysis, tests, and that the
# generated database code is current. The store builds are separate:
# android.yml and ios.yml (see docs/RELEASE.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The recognition integration tests read a real booklet photograph with a
      # real PP-OCR model. The phone uses PaddleOCR through its own plugin, which
      # cannot run here; this is the same model family through ONNX Runtime
      # (tool/bench/ocr_server.py). The tests fail, rather than skip, if it is missing.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the OCR stand-in for the recognition tests
        run: pip install rapidocr-onnxruntime opencv-python-headless

      - name: Generated code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/ || (echo "Generated drift code is out of date. Run: dart run build_runner build" && exit 1)

      - name: Analyze
        run: flutter analyze

      - name: Test
        env:
          REQUIRE_OCR_STANDIN: '1'
        run: flutter test
