name: unimarkly
description: Exam score scanner and result compiler. Works offline.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.28.0
  drift_flutter: ^0.2.4
  flutter_riverpod: ^2.6.1
  path: ^1.9.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  csv: ^6.0.0
  excel: ^4.0.6
  pdf: ^3.11.1
  archive: ^3.6.1
  file_picker: ^8.1.0
  share_plus: ^10.1.0
  collection: ^1.19.0
  package_info_plus: ^9.0.1
  crypto: ^3.0.7
  image_picker: ^1.2.1
  google_mlkit_text_recognition: ^0.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.28.0
  build_runner: ^2.4.0
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0
  xml: ^6.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png

# App icon. The artwork is built by tool/make_icons.py from design/icon/source.png.
# Regenerate the platform icons with:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icon/adaptive_background.png"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"
  min_sdk_android: 21
