plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing. In CI the key comes from repository secrets, which the
// workflow writes to android/key.properties. Without it (local builds, pull
// requests) the release build falls back to the debug key so it still builds,
// but that APK cannot be uploaded to Google Play.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.nassaracoretech.unimarkly"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // Kept from the previous build setup: lets plugins that use newer Java
        // APIs (java.time) keep working on older Android versions.
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.nassaracoretech.unimarkly"
        // PaddleOCR needs Android 8 (API 26) and a 64-bit ARM phone, which is
        // every phone sold for years. Other CPU types are left out of the app.
        minSdk = 26
        ndk {
            abiFilters "arm64-v8a"
        }
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    packaging {
        jniLibs {
            excludes += ["lib/armeabi-v7a/**", "lib/x86/**", "lib/x86_64/**"]
        }
    }

    signingConfigs {
        release {
            if (keystoreProperties["storeFile"] != null) {
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = keystoreProperties["storeFile"] != null ? signingConfigs.release : signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}

flutter {
    source = "../.."
}
